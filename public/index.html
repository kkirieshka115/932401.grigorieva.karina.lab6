<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieList — Каталог кино</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="/" class="brand">
                <span class="brand-mark"></span>
                Movie<span>List</span>
            </a>
            <nav class="nav">
                <a href="/" class="nav-link active">Фильмы</a>
                <a href="/about" class="nav-link">О работе</a>
            </nav>
        </div>
    </header>

    <main class="container main">
        <div class="hero-head">
            <h1>Лучшие фильмы по рейтингу</h1>
            <p class="subtitle">Подборка фильмов, отсортированная по оценкам зрителей</p>
        </div>

        <section class="controls-bar">
            <div class="search-group">
                <input type="text" id="ratingInput" placeholder="Минимальный рейтинг (0–10)">
                <button id="filterBtn" class="btn-red">Найти</button>
                <button id="resetBtn" class="btn-light">Сбросить</button>
            </div>

            <div class="presets">
                <button class="preset active" data-val="">Все</button>
                <button class="preset" data-val="8.5">8.5+</button>
                <button class="preset" data-val="8">8.0+</button>
                <button class="preset" data-val="7">7.0+</button>
            </div>
        </section>

        <div id="errorBox" class="alert-error hidden"></div>

        <section id="moviesGrid" class="movies-grid"></section>
    </main>

    <!-- Модальное окно с описанием фильма -->
    <div id="movieModal" class="modal hidden">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-window">
            <button class="modal-close" id="modalCloseBtn">✕</button>
            <div class="modal-grid">
                <img id="modalPoster" class="modal-poster" src="" alt="">
                <div class="modal-info">
                    <div class="modal-badges">
                        <span class="modal-rating" id="modalRating">9.1</span>
                        <span class="modal-genre" id="modalGenre">Драма</span>
                    </div>
                    <h2 id="modalTitle">Название фильма</h2>
                    <p class="modal-sub" id="modalSub">1999 • 189 мин • Реж. Фрэнк Дарабонт</p>
                    <p class="modal-desc" id="modalDesc">Описание фильма...</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container footer-inner">
            <span>Григорьева Карина • Группа 932401</span>
            <span>Лабораторная работа №6 • Вариант 15</span>
        </div>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
